<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Merch | CPRT</title>
  <link rel="icon" href="./static/images/cprt-favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="preload" href="./static/fonts/Nasalization Rg.otf" as="font" type="font/otf" crossorigin>
  <link href="./static/styles/main.css" rel="stylesheet">
  <link href="./static/styles/pages.css" rel="stylesheet">
  <script src="scripts/components/navbar-component.js" defer></script>
  <script src="scripts/components/footer-component.js" defer></script>
  <script src="scripts/components/page-hero-component.js" defer></script>
  <script src="scripts/site.js" defer></script>
</head>
<body>
  <header-component></header-component>
  <main>
    <page-hero title="Robo swag" images="./static/images/others/old-cprt-patch.png">Buy our merch to fund the team and support our journey.</page-hero>
    <div class="tier-head"><h2 class="display">Our merch</h2></div>
    <div class="note"><p>We accept cash or e-transfer. Pick up orders in the EDC.</p><p>Our patches are also on the <a href="https://shop.mycses.ca/collections/patches">CSES website</a>.</p></div>
    <div class="merch-container">
      <merch-card class="sold-out"><h3>Baseball hat</h3><div class="pic"><img src="./static/images/merch/baseball-hat.png" alt="Baseball hat" loading="lazy"></div><p class="price">$20.00</p></merch-card>
      <merch-card class=""><h3>CIRC 2025 patch</h3><div class="pic"><img src="./static/images/merch/patch-circ2025.png" alt="CIRC 2025 patch" loading="lazy"></div><p class="price">$3.00</p></merch-card>
      <merch-card class=""><h3>CIRC 2024 patch</h3><div class="pic"><img src="./static/images/merch/patch-circ2024.png" alt="CIRC 2024 patch" loading="lazy"></div><p class="price">$5.00</p></merch-card>
      <merch-card class=""><h3>Spike's wheel patch</h3><div class="pic"><img src="./static/images/merch/patch-spike-wheel.png" alt="Spike's wheel patch" loading="lazy"></div><p class="price">$4.00</p></merch-card>
    </div>
  </main>
  <footer-component></footer-component>
</body>
</html>
